<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giải đấu · OTTv1</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main>
    <h1>Giải đấu</h1>
    <div class="tlist" id="list"><div class="empty">đang tải…</div></div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/rps.js"></script>
  <script src="/js/common.js"></script>
  <script>
    let tournaments = [];

    function subLine(t) {
      if (ME.role === 'judge') return `<span class="muted">${t.teamsReady} đội sẵn sàng</span>`;
      const s = t.mySubmission;
      if (!s) return t.status === 'open' ? '<span class="muted">Bạn chưa nộp bot nào.</span>' : '';
      const icon = { ok: '✅ sẵn sàng', error: '❌ bị lỗi', pending: '⏳ đang kiểm tra…' }[s.status];
      const fallback = s.status !== 'ok' && t.myActive ? ' <span class="muted">(phiên bản trước vẫn đang được dùng)</span>' : '';
      return `Bot của bạn: <b>${LANG_LABEL[s.language]}</b> · <span class="tag ${s.status}">${icon}</span>${fallback}`;
    }

    function render() {
      const list = $('#list');
      if (!tournaments.length) {
        list.innerHTML = `<div class="empty">${avatarSvg('#bbb', 90)}<br>Chưa có giải đấu nào. Chắc trọng tài vẫn đang mài kéo.</div>`;
        return;
      }
      list.innerHTML = tournaments.map(t => {
        const id = encodeURIComponent(t.id);
        const waiting = t.status === 'open' && t.startsAt && Date.parse(t.startsAt) > serverNow(); // not open for submissions yet
        const statusText = waiting ? 'sắp mở' : { open: 'đang nhận bot', running: 'ĐANG DIỄN RA', finished: 'đã kết thúc' }[t.status];
        let timer = '';
        if (waiting) timer = `<small class="muted">mở nhận bài sau</small><div class="countdown" data-deadline="${t.startsAt}" data-opens="1"></div><small class="muted">mở lúc ${esc(fmtDate(t.startsAt))} · đóng lúc ${esc(fmtDate(t.deadline))}</small>`;
        else if (t.status === 'open' && t.daily) timer = `<small class="muted">📅 thi đấu mỗi ngày lúc ${t.daily.time}</small><div class="countdown" data-deadline="${t.daily.nextAt || t.deadline}"></div><small class="muted">${t.daily.nextAt ? `trận tiếp theo · ${esc(fmtDate(t.daily.nextAt))}` : 'không còn ngày thi đấu nào'}<br>kết thúc lúc ${esc(fmtDate(t.deadline))}</small>`;
        else if (t.status === 'open') timer = `<div class="countdown" data-deadline="${t.deadline}"></div><small class="muted">đóng lúc ${esc(fmtDate(t.deadline))}</small>`;
        else if (t.status === 'running') timer = `<div class="countdown">${t.daily ? '🔥 ngày cuối…' : '🔥 đang đấu…'}</div>`;
        else timer = `<div class="countdown">${t.champion ? '🏆 ' + esc(t.champion) : 'không có người thắng'}</div>`;
        const actions = [];
        if (waiting && ME.role !== 'judge') actions.push(`<a class="btn" href="/tournament/${id}/submit">Xem luật & chuẩn bị code 📜</a>`);
        else if (t.status === 'open' && ME.role !== 'judge') actions.push(`<a class="btn red" href="/tournament/${id}/submit">Nộp code ✍️</a>`);
        // the judge sees practice scores and results on the leaderboard (brawl) or the campaign board
        if (t.status === 'open' && ME.role === 'judge' && t.mode === 'campaign') actions.push(`<a class="btn" href="/tournament/${id}/submit">Bảng chiến dịch 🗺️</a>`);
        if (t.status === 'open' && ME.role === 'judge') actions.push(`<a class="btn" href="/admin">Quản lý</a>`);
        if (t.status === 'open' && t.mode === 'campaign' && ME.role !== 'judge') actions.push(`<a class="btn" href="/tournament/${id}/live">Bảng xếp hạng 🗺️</a>`);
        if (t.status === 'open' && t.daily && !waiting) actions.push(`<a class="btn" href="/tournament/${id}/live">Bảng xếp hạng 📅</a>`);
        if (t.status !== 'open') actions.push(`<a class="btn ${t.status === 'running' ? 'yellow' : ''}" href="/tournament/${id}/live">${t.status === 'running' ? 'Xem trực tiếp 👀' : 'Kết quả 🏆'}</a>`);
        return `
          <div class="box tcard">
            <div>
              <div class="row"><h2>${esc(t.name)}</h2><span class="tag ${waiting ? 'pending' : t.status}">${statusText}</span>${t.game === 'board' ? '<span class="tag mode" title="bàn cờ 9×9: búa, bao, kéo đi từng ô">♟️ cờ OTT</span>' : ''}<span class="tag mode">${t.mode === 'campaign' ? '🗺️ chiến dịch' : '⚔️ hỗn chiến'}</span>${t.access === 'invite' ? `<span class="tag mode" title="chỉ những đội được trọng tài chỉ định">🔒 ${ME.role === 'judge' ? `${t.members} đội được chỉ định` : 'giải riêng'}</span>` : ''}</div>
              ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ''}
              <div style="margin-top:6px">${subLine(t)}</div>
            </div>
            <div class="actions" style="text-align:center">${timer}${actions.join('')}</div>
          </div>`;
      }).join('');
      tick();
    }

    function tick() {
      for (const el of $$('.countdown[data-deadline]')) {
        const left = Date.parse(el.dataset.deadline) - serverNow();
        if (left <= 0 && el.dataset.opens) { render(); return; } // just opened: show the submit button
        el.textContent = left > 0 ? fmtCountdown(left) : 'hết giờ!';
        el.classList.toggle('soon', left > 0 && left < 60000);
      }
    }

    async function load() {
      const data = await api('/api/tournaments');
      tournaments = data.tournaments;
      render();
    }

    (async () => {
      const socket = await boot();
      socket.on('tournaments:changed', load);
      await load();
      setInterval(tick, 250);
      setInterval(load, 15000); // pick up submission status changes
    })();
  </script>
</body>
</html>
