<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trận đấu · OTTv1</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main>
    <h1>Trận đấu 🎩</h1>
    <div class="row" style="align-items:center;gap:10px;margin-bottom:10px">
      <label for="pick" class="muted">giải</label>
      <select id="pick" style="min-width:260px"></select>
      <a class="btn small" id="live" href="#">bảng xếp hạng ↗</a>
    </div>
    <div class="game-tabs match-days" id="days"></div>
    <div class="box">
      <p class="muted" id="summary" style="margin:0 0 6px;font-size:17px"></p>
      <div style="overflow-x:auto">
        <table class="plain match-list">
          <thead><tr><th>#</th><th>đội A</th><th></th><th>đội B</th><th>thắng</th><th>tỉ số</th><th>thời gian</th><th>lúc</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/rps.js"></script>
  <script src="/js/common.js"></script>
  <script>
    // The judge's list of every match: pick a tournament, then a day (or round); matches by id.
    const query = new URLSearchParams(location.search);
    let tid = query.get('t');
    let group = query.get('g');
    let data = null;

    function fmtDuration(ms) {
      if (ms === null || ms === undefined) return '–';
      const s = ms / 1000;
      if (s < 60) return `${s.toFixed(1)} s`;
      return `${Math.floor(s / 60)} phút ${Math.round(s % 60)} s`;
    }
    const fmtClock = iso => (iso ? new Date(iso).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '');
    const team = (name, user) => `${esc(name)}${user ? ` <small class="muted">@${esc(user)}</small>` : ''}`;

    function remember() {
      history.replaceState(null, '', `/admin/matches?t=${encodeURIComponent(tid)}${group ? `&g=${encodeURIComponent(group)}` : ''}`);
    }

    function render() {
      const { groups, matches, tournament } = data;
      $('#live').href = `/tournament/${encodeURIComponent(tournament.id)}/live`;
      if (!groups.some(g => g.key === group)) group = (groups[groups.length - 1] || {}).key || null; // newest day by default
      remember();
      const count = key => matches.filter(m => m.group === key).length;
      $('#days').innerHTML = groups.map(g => `<button class="${g.key === group ? 'on' : ''}" data-g="${g.key}">${esc(g.label)}
        <small>${g.at ? esc(fmtDate(g.at)) : ''} · ${count(g.key)} trận${g.status === 'running' ? ' · đang đấu' : g.status === 'done' ? ' · chưa công bố' : ''}</small></button>`).join('')
        || '<p class="muted">Giải này chưa có ngày thi đấu nào.</p>';
      $$('#days button').forEach(b => b.onclick = () => { group = b.dataset.g; render(); });

      const list = matches.filter(m => m.group === group);
      const g = groups.find(x => x.key === group);
      const total = list.reduce((s, m) => s + (m.durationMs || 0), 0);
      $('#summary').textContent = g
        ? `${g.label}${g.rounds ? ` · ${g.rounds} vòng Thụy Sĩ` : ''} · ${list.length} trận · tổng thời gian đấu ${fmtDuration(total)}${list.length ? ` · trung bình ${fmtDuration(total / list.filter(m => m.durationMs !== null).length || 0)}` : ''}`
        : '';
      $('#rows').innerHTML = list.map(m => {
        const winner = m.winner === 'A' ? team(m.teamA, m.userA) : m.winner === 'B' ? team(m.teamB, m.userB) : '<span class="muted">hòa 🤝</span>';
        const href = `/tournament/${encodeURIComponent(tournament.id)}/match?name=${encodeURIComponent(m.name)}`;
        return `<tr>
          <td class="muted">${m.id ?? '–'}${m.dayRound ? `<br><small>vòng ${m.dayRound}</small>` : ''}</td>
          <td class="${m.winner === 'A' ? 'won' : ''}">${team(m.teamA, m.userA)}</td>
          <td class="muted">vs</td>
          <td class="${m.winner === 'B' ? 'won' : ''}">${team(m.teamB, m.userB)}</td>
          <td>${m.winner !== 'draw' ? '👑 ' : ''}${winner}</td>
          <td class="score">${m.scoreA} – ${m.scoreB}</td>
          <td>${fmtDuration(m.durationMs)}</td>
          <td class="muted">${esc(fmtClock(m.playedAt))}</td>
          <td><a class="btn small" href="${href}">xem ▶</a></td>
        </tr>`;
      }).join('') || '<tr><td colspan="9" class="center muted">Chưa có trận nào trong ngày này.</td></tr>';
    }

    async function load() {
      if (!tid) return;
      data = await api(`/api/admin/tournaments/${encodeURIComponent(tid)}/matches`);
      render();
    }

    (async () => {
      const socket = await boot();
      const { tournaments } = await api('/api/tournaments');
      if (!tournaments.length) {
        $('#summary').textContent = 'Chưa có giải đấu nào.';
        return;
      }
      if (!tournaments.some(t => t.id === tid)) tid = tournaments[0].id; // newest
      $('#pick').innerHTML = tournaments.map(t => `<option value="${esc(t.id)}" ${t.id === tid ? 'selected' : ''}>${esc(t.name)} · ${t.game === 'board' ? 'cờ OTT' : 'oẳn tù tì'}</option>`).join('');
      $('#pick').onchange = () => { tid = $('#pick').value; group = null; load(); };
      await load();
      // new matches as they finish (at most one reload a second)
      let pending = null;
      socket.on('match:done', m => {
        if (m.tournamentId !== tid || pending) return;
        pending = setTimeout(() => { pending = null; load(); }, 1000);
      });
    })().catch(e => toast(e.message, 'error'));
  </script>
</body>
</html>
