<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch sử trận đấu · OTTv1</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main class="full">
    <a id="back" href="/">← quay lại bảng xếp hạng</a>
    <h1 id="tname">Lịch sử trận đấu</h1>
    <div class="match-tools">
      <input id="q" type="search" placeholder="tìm theo mã trận (vd 137) hoặc tên đội / @username" autocomplete="off">
    </div>
    <div class="game-tabs match-days" id="days"></div>
    <div class="box">
      <p class="muted" id="summary" style="margin:0 0 6px;font-size:17px"></p>
      <div style="overflow-x:auto">
        <table class="plain match-list">
          <!-- fixed column widths: every day's table is the same size, long names are cut short (…) -->
          <colgroup><col style="width:64px"><col style="width:130px"><col><col style="width:40px"><col><col><col style="width:110px"><col style="width:130px"><col style="width:100px"><col style="width:84px"></colgroup>
          <thead><tr><th>#</th><th>vòng</th><th>đội A</th><th></th><th>đội B</th><th>thắng</th><th>tỉ số</th><th title="thời gian chạy trận đấu, từ lúc bắt đầu tới lúc xong">thời gian chạy</th><th>xong lúc</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/rps.js"></script>
  <script src="/js/common.js"></script>
  <script>
    // A tournament's match history: a tab per day (or round), matches by id, and a search over every
    // day by match id or team name / @username. The judge sees every match, players the published ones.
    const tid = tournamentIdFromPath();
    const query = new URLSearchParams(location.search);
    let group = query.get('g');
    let search = query.get('q') || '';
    let data = null;

    function fmtDuration(ms) {
      if (ms === null || ms === undefined) return '–';
      const s = ms / 1000;
      if (s < 60) return `${s.toFixed(1)} s`;
      return `${Math.floor(s / 60)} phút ${Math.round(s % 60)} s`;
    }
    const fmtClock = iso => (iso ? new Date(iso).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '');
    const tip = (name, user) => `${name}${user ? ` @${user}` : ''}`;
    const team = (name, user) => `${esc(name)}${user ? ` <small class="muted">@${esc(user)}</small>` : ''}`;
    const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();

    // "137" / "#137": that match id; anything else: part of a team name or @username (accents ignored)
    function matches(m, q) {
      const id = q.replace(/^#/, '');
      if (/^\d+$/.test(id)) return m.id === +id;
      const want = fold(q.replace(/^@/, ''));
      return [m.teamA, m.teamB, m.userA, m.userB].some(x => fold(x).includes(want));
    }

    function remember() {
      const p = new URLSearchParams();
      if (group) p.set('g', group);
      if (search) p.set('q', search);
      history.replaceState(null, '', `${location.pathname}${p.toString() ? `?${p}` : ''}`);
    }

    function render() {
      const { groups, matches: all, tournament } = data;
      $('#tname').textContent = `Lịch sử trận đấu · ${tournament.name}`;
      document.title = `Lịch sử trận đấu · ${tournament.name} · OTTv1`;
      if (!groups.some(g => g.key === group)) group = (groups[groups.length - 1] || {}).key || null; // newest day by default
      remember();
      const q = search.trim();
      const count = key => all.filter(m => m.group === key).length;
      const label = g => (g.status === 'running' ? ' · đang đấu' : g.status === 'done' ? ' · chưa công bố' : '');
      $('#days').innerHTML = groups.map(g => `<button class="${!q && g.key === group ? 'on' : ''}" data-g="${g.key}">${esc(g.label)}
        <small>${g.at ? esc(fmtDate(g.at)) : ''} · ${count(g.key)} trận${label(g)}</small></button>`).join('')
        || '<p class="muted">Giải này chưa có ngày thi đấu nào.</p>';
      $$('#days button').forEach(b => b.onclick = () => { group = b.dataset.g; search = ''; $('#q').value = ''; render(); });

      const g = groups.find(x => x.key === group);
      const list = q ? all.filter(m => matches(m, q)) : all.filter(m => m.group === group);
      const timed = list.filter(m => m.durationMs !== null);
      const total = timed.reduce((s, m) => s + m.durationMs, 0);
      const head = q ? `Tìm "${q}" trong mọi ngày` : g ? `${g.label}${g.rounds ? ` · ${g.rounds} vòng Thụy Sĩ` : ''}` : '';
      $('#summary').textContent = head
        ? `${head} · ${list.length} trận${timed.length ? ` · tổng thời gian chạy ${fmtDuration(total)} · trung bình ${fmtDuration(total / timed.length)}` : ''}`
          + (timed.length < list.length ? ` · ${list.length - timed.length} trận đấu trước khi có ghi thời gian chạy (–)` : '')
        : '';
      const groupLabel = key => (groups.find(x => x.key === key) || {}).label || '';
      const me = ME && ME.username;
      const empty = q ? 'Không có trận nào khớp.'
        : g && !data.judge && g.status !== 'published' ? 'Kết quả ngày này chưa được công bố.'
        : 'Chưa có trận nào trong ngày này.';
      $('#rows').innerHTML = list.map(m => {
        const winner = m.winner === 'A' ? team(m.teamA, m.userA) : m.winner === 'B' ? team(m.teamB, m.userB) : '<span class="muted">hòa 🤝</span>';
        const href = `/tournament/${encodeURIComponent(tournament.id)}/match?name=${encodeURIComponent(m.name)}`;
        const where = q ? [groupLabel(m.group), m.dayRound ? `vòng ${m.dayRound}` : ''].filter(Boolean).join(' · ') : m.dayRound ? String(m.dayRound) : '';
        return `<tr class="${me && (m.userA === me || m.userB === me) ? 'me' : ''}">
          <td class="muted">${m.id ?? '–'}</td>
          <td class="muted">${esc(where || '–')}</td>
          <td class="${m.winner === 'A' ? 'won' : ''}" title="${esc(tip(m.teamA, m.userA))}">${team(m.teamA, m.userA)}</td>
          <td class="muted">vs</td>
          <td class="${m.winner === 'B' ? 'won' : ''}" title="${esc(tip(m.teamB, m.userB))}">${team(m.teamB, m.userB)}</td>
          <td title="${esc(m.winner === 'A' ? tip(m.teamA, m.userA) : m.winner === 'B' ? tip(m.teamB, m.userB) : '')}">${m.winner !== 'draw' ? '👑 ' : ''}${winner}</td>
          <td class="score">${m.scoreA} – ${m.scoreB}</td>
          <td>${fmtDuration(m.durationMs)}</td>
          <td class="muted">${esc(fmtClock(m.playedAt))}</td>
          <td><a class="btn small" href="${href}">xem ▶</a></td>
        </tr>`;
      }).join('') || `<tr><td colspan="10" class="center muted">${empty}</td></tr>`;
    }

    async function load() {
      try {
        data = await api(`/api/tournaments/${encodeURIComponent(tid)}/history`);
      } catch (e) {
        $('#summary').textContent = e.message;
        return;
      }
      render();
    }

    (async () => {
      const socket = await boot();
      $('#back').href = `/tournament/${encodeURIComponent(tid)}/live`;
      $('#q').value = search;
      $('#q').oninput = () => { search = $('#q').value; if (data) render(); };
      await load();
      // new matches (the judge) and newly published days (everyone): at most one reload every 2 s
      let pending = null;
      const reload = () => { if (!pending) pending = setTimeout(() => { pending = null; load(); }, 2000); };
      socket.emit('watch', tid);
      socket.on('connect', () => socket.emit('watch', tid));
      socket.on('match:done', m => { if (m.tournamentId === tid) reload(); });
      socket.on('leaderboard', b => { if (b.id === tid) reload(); });
    })().catch(e => toast(e.message, 'error'));
  </script>
</body>
</html>
