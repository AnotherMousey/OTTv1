<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trực tiếp · OTTv1</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main>
    <div class="live-head">
      <h1 id="tname">…</h1>
      <div class="round-banner" id="banner"></div>
      <div class="progress hidden" id="progress"><div></div></div>
      <div class="muted" id="sub" style="font-size:18px"></div>
    </div>
    <div class="champ-banner hidden" id="champ"></div>
    <table class="board">
      <thead id="lhead"><tr><th>#</th><th>đội</th><th class="hide-sm">ngôn ngữ</th><th>điểm vòng</th><th class="hide-sm">T · H · B</th><th class="hide-sm">tổng</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <section id="matches" class="hidden">
      <div class="squiggle"></div>
      <h2 id="matchesTitle">Các trận đấu</h2>
      <div id="feed"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/rps.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/campaign.js"></script>
  <script>
    const tid = tournamentIdFromPath();
    let lastBoard = null;
    let canSeeMatches = false;
    let wasFinished = null;
    const prevPoints = {};

    function statusCell(r) {
      switch (r.status) {
        case 'champion': return '🏆';
        case 'runner-up': return '🥈';
        case 'eliminated': return `💀<span class="muted" style="font-size:15px"> v${r.round}</span>`;
        default: return r.rank;
      }
    }

    // ---------- campaign mode ----------
    const cstate = { openUser: null, details: null };
    let campaignCountdown = null;
    async function openCampaignRow(user) {
      cstate.openUser = user;
      cstate.details = null;
      if (user) {
        try {
          const d = await api(`/api/tournaments/${encodeURIComponent(tid)}/practice?user=${encodeURIComponent(user)}`);
          cstate.details = d.details;
        } catch (e) { cstate.openUser = null; toast(e.message, 'error'); }
      }
      renderCampaignBoard(lastBoard);
    }
    function renderCampaignBoard(b) {
      lastBoard = b;
      $('#tname').textContent = b.name;
      document.title = `Trực tiếp · ${b.name}`;
      $('#lhead').innerHTML = CAMPAIGN_HEAD;
      $('table.board').classList.add('practice');
      $('#progress').classList.add('hidden');
      const banner = $('#banner'), sub = $('#sub');
      clearInterval(campaignCountdown);
      if (b.status === 'open') {
        const tickCd = () => {
          const el = $('#ccd');
          if (!el) return;
          const toStart = Date.parse(b.startedAt) - serverNow(); // startedAt = the start time, if the judge set one
          if (toStart > 0) { el.previousSibling.textContent = '🗺️ Chiến dịch mở sau '; el.textContent = fmtCountdown(toStart); }
          else { el.previousSibling.textContent = '🗺️ Chiến dịch đang diễn ra, kết thúc sau '; el.textContent = fmtCountdown(Date.parse(b.deadline) - serverNow()); }
        };
        banner.innerHTML = '<span></span><span id="ccd"></span>';
        tickCd();
        campaignCountdown = setInterval(tickCd, 500);
        sub.innerHTML = `Đến giờ có ${b.finishers} đội đã hạ cả ${b.total} bot đấu tập · <a href="/tournament/${encodeURIComponent(tid)}/submit">nộp bot</a>`;
      } else if (b.status === 'running') {
        banner.innerHTML = '⏳ Hết giờ! Đang chấm những bài nộp cuối cùng…';
        sub.textContent = 'Các bot nộp trước hạn chót vẫn được tính.';
      } else {
        const w = b.rows[0] && b.rows[0].beaten > 0 ? b.rows[0] : null;
        banner.innerHTML = w ? `🏆 Đội chiến thắng: <b>${esc(w.teamName)}</b>!` : '🏁 Chiến dịch kết thúc! Không đội nào hạ được bot đấu tập nào.';
        sub.textContent = !w ? '' : w.finishedAt
          ? `Hạ cả ${b.total} bot đấu tập · về đích lúc ${fmtClock(w.finishedAt)} · PEN ${w.pen}`
          : `Hạ ${w.beaten}/${b.total} bot đấu tập · PEN ${w.pen}`;
      }
      const champ = $('#champ');
      // finished: the top team is the winner even if nobody beat all 10; still running: first finisher
      const top = b.rows[0];
      const first = b.status === 'finished' ? (top && top.beaten > 0 ? top : null) : (top && top.finishedAt ? top : null);
      if (first) {
        champ.classList.remove('hidden');
        const when = first.finishedAt ? fmtClock(first.finishedAt) : `${first.beaten}/${b.total} bot đấu tập`;
        champ.innerHTML = `${avatarSvg(first.avatar, 110, { mouth: 'smile' })}<br><span class="big">${b.status === 'finished' ? '🏆' : '🏁'} ${esc(first.teamName)}</span><div class="muted">${b.status === 'finished' ? 'nhà vô địch chiến dịch' : 'về đích đầu tiên'} · ${esc(when)}</div>`;
        if (wasFinished === false && b.status === 'finished') confetti();
      } else champ.classList.add('hidden');
      wasFinished = b.status === 'finished';
      renderCampaignTable($('#rows'), b, cstate, openCampaignRow);
    }

    // ---------- daily league (brawl) ----------
    let dailyTimer = null, shownDays = null;
    function renderDailyBoard(b) {
      lastBoard = b;
      $('#tname').textContent = b.name;
      document.title = `Trực tiếp · ${b.name}`;
      $('#lhead').innerHTML = '<tr><th>#</th><th>đội</th><th title="điểm cộng dồn qua các ngày thi đấu">điểm hiện tại</th><th title="điểm đấu tập của bot mới nhất của đội (đấu với các bot đấu tập)">điểm đánh giá</th></tr>';
      const banner = $('#banner'), sub = $('#sub'), prog = $('#progress');
      const published = b.days.filter(d => d.status === 'published');
      const pending = b.days.find(d => d.status !== 'published'); // playing, or waiting to be published
      clearInterval(dailyTimer);
      const tickBanner = () => {
        if (b.status === 'finished') banner.innerHTML = `🏁 Giải kết thúc sau ${published.length} ngày thi đấu.`;
        else if (b.error) banner.innerHTML = `😵 Có lỗi xảy ra: ${esc(b.error)}`;
        else if (pending) {
          const left = Date.parse(pending.publishAt) - serverNow();
          const what = pending.status !== 'running' ? `⏳ Ngày ${pending.number} đã đấu xong` : `⚔️ Ngày ${pending.number} đang thi đấu${pending.rounds ? ` · vòng ${pending.round}/${pending.rounds}` : ''}`;
          banner.innerHTML = `${what} · kết quả công bố ${left > 0 ? `sau <b>${fmtCountdown(left)}</b>` : 'ngay khi đấu xong'}`;
        } else if (b.nextAt) banner.innerHTML = `📅 Ngày thi đấu tiếp theo sau <b>${fmtCountdown(Date.parse(b.nextAt) - serverNow())}</b>`;
        else banner.innerHTML = b.status === 'running' ? '⏳ Đang công bố ngày cuối…' : '📅 Không còn ngày thi đấu nào trước khi giải kết thúc';
      };
      tickBanner();
      if (b.status !== 'finished') dailyTimer = setInterval(tickBanner, 500);
      prog.classList.toggle('hidden', !(pending && pending.status === 'running'));
      if (pending && pending.status === 'running') prog.firstElementChild.style.width = (pending.totalMatches ? (100 * pending.played) / pending.totalMatches : 0) + '%';
      const playing = pending && pending.status === 'running' ? ` · ngày ${pending.number}: đã đấu ${pending.played}/${pending.totalMatches} trận` : '';
      sub.innerHTML = `Mỗi ngày lúc ${esc(b.dailyTime)} · ${b.pairing === 'swiss' ? 'thể thức Thụy Sĩ' : 'vòng tròn'} · thắng 3 · hòa 1 · thua 0 · ${published.length} ngày đã công bố${playing} · ${b.status === 'finished' ? 'kết thúc' : 'kết thúc lúc'} ${esc(fmtDate(b.deadline))}`
        + (b.status === 'open' && ME.role !== 'judge' ? ` · <a href="/tournament/${encodeURIComponent(tid)}/submit">nộp bot</a>` : '')
        + `<br>Điểm đánh giá: điểm đấu tập của bot mới nhất của đội (tổng điểm khi đấu với các bot đấu tập), cập nhật ngay khi đấu tập xong. Bằng điểm hiện tại thì đội có điểm đánh giá cao hơn xếp trên.`;

      const champ = $('#champ');
      if (b.champion) {
        champ.classList.remove('hidden');
        champ.innerHTML = `${avatarSvg(b.champion.avatar, 120, { mouth: 'smile' })}<br><span class="big">🏆 ${esc(b.champion.teamName)} 🏆</span><div class="muted">vô địch ${esc(b.name)}</div>`;
        if (wasFinished === false) confetti();
      } else champ.classList.add('hidden');
      wasFinished = b.status === 'finished';

      const tbody = $('#rows');
      const before = rowPositions(tbody);
      tbody.innerHTML = b.rows.map(row => {
        const top = row.played > 0 && row.rank <= 3; // medals once a team has played
        const cls = [b.champion && b.champion.userId === row.userId ? 'champion' : '', ME && row.userId === ME.id ? 'me' : '', prevPoints[row.userId] !== undefined && prevPoints[row.userId] !== row.points ? 'flash' : ''].join(' ');
        return `<tr class="${cls}" data-id="${row.userId}">
          <td class="rank">${b.champion && b.champion.userId === row.userId ? '🏆' : top ? ['🥇', '🥈', '🥉'][row.rank - 1] : row.rank}</td>
          <td><div class="team">${avatarSvg(row.avatar, 40)}<span class="n">${esc(row.teamName)}</span>${row.username ? `<small class="uname">@${esc(row.username)}</small>` : ''}${ME && row.userId === ME.id ? '<span class="muted" style="font-size:16px">← bạn!</span>' : ''}</div></td>
          <td class="pts" title="${row.w} thắng · ${row.d} hòa · ${row.l} thua${row.lastDay !== null ? ` · ngày gần nhất +${row.lastDay}` : ''}">${row.points}</td>
          <td class="evalcell">${row.eval !== null ? `<span class="pts" style="font-size:26px">${row.eval}<small class="muted" style="font-size:16px">/${row.evalMax}</small></span>`
            : `<span class="muted" style="font-size:18px">${{ queued: '⏳ đang chờ đấu tập', running: '🥊 đang đấu tập…', error: 'chấm thất bại' }[row.evalStatus] || 'chưa đánh giá'}</span>`}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="4" class="center muted">chưa có đội nào có bot chạy được</td></tr>';
      b.rows.forEach(row => { prevPoints[row.userId] = row.points; });
      slideRows(tbody, before);

      // new results published: refresh the replays
      if (shownDays !== null && shownDays !== published.length) loadMatches();
      shownDays = published.length;
    }

    // FLIP animation: remember where rows were, re-render, then slide them.
    function rowPositions(tbody) {
      const before = {};
      $$('tr', tbody).forEach(tr => { before[tr.dataset.id] = tr.getBoundingClientRect().top; });
      return before;
    }
    function slideRows(tbody, before) {
      $$('tr', tbody).forEach(tr => {
        const old = before[tr.dataset.id];
        if (old === undefined) return;
        const dy = old - tr.getBoundingClientRect().top;
        if (!dy) return;
        tr.style.transform = `translateY(${dy}px)`;
        tr.style.transition = 'none';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          tr.style.transition = 'transform .6s cubic-bezier(.3,1.4,.5,1)';
          tr.style.transform = '';
        }));
      });
    }

    function renderBoard(b) {
      if (b.mode === 'campaign') return renderCampaignBoard(b);
      if (b.format === 'daily') return renderDailyBoard(b);
      lastBoard = b;
      $('#tname').textContent = b.name;
      document.title = `Trực tiếp · ${b.name}`;
      const banner = $('#banner'), sub = $('#sub'), prog = $('#progress');
      prog.classList.add('hidden');
      sub.textContent = '';
      if (b.status === 'open') {
        banner.innerHTML = `Vẫn đang nhận bài · bắt đầu lúc ${esc(fmtDate(b.deadline))}`;
      } else if (b.error) {
        banner.innerHTML = `😵 Có lỗi xảy ra: ${esc(b.error)}`;
      } else if (b.entries === null) {
        banner.innerHTML = '⏳ Đang thu thập những bot cuối cùng…';
      } else if (b.status === 'finished') {
        banner.innerHTML = b.champion ? `Kết thúc! ${b.round ? `${b.round.number} vòng hỗn loạn.` : ''}` : (b.entries ? '' : 'Chẳng ai tham gia. 🦗');
      } else if (!b.round) {
        banner.innerHTML = `🥁 ${b.entries} đội đang tiến vào đấu trường…`;
      } else {
        const r = b.round;
        const what = r.isFinal ? '🔥 CHUNG KẾT 🔥' : `Vòng ${r.number}`;
        if (r.status === 'done') {
          banner.innerHTML = `${what} đã kết thúc! ${r.eliminating ? `${r.eliminating} đội bị loại 👢` : ''}`;
          sub.textContent = r.isFinal ? '' : 'Vòng tiếp theo sắp bắt đầu…';
        } else {
          banner.innerHTML = `${what} · còn ${r.teams} đội`;
          sub.textContent = r.isFinal ? 'Người thắng lấy tất cả.' : `${r.eliminating} đội cuối bảng sẽ bị loại sau vòng này`;
          prog.classList.remove('hidden');
          prog.firstElementChild.style.width = (r.totalMatches ? (100 * r.played) / r.totalMatches : 0) + '%';
          sub.textContent += ` · đã đấu ${r.played}/${r.totalMatches} trận`;
        }
      }

      const champ = $('#champ');
      if (b.champion) {
        champ.classList.remove('hidden');
        champ.innerHTML = `${avatarSvg(b.champion.avatar, 120, { mouth: 'smile' })}<br><span class="big">🏆 ${esc(b.champion.teamName)} 🏆</span><div class="muted">vô địch ${esc(b.name)}</div>`;
        if (wasFinished === false) confetti();
      } else champ.classList.add('hidden');
      wasFinished = b.status === 'finished';

      const tbody = $('#rows');
      const before = rowPositions(tbody);
      const r = b.round;
      const dangerFrom = r && r.status === 'running' && r.eliminating ? r.teams - r.eliminating : Infinity;
      let aliveIndex = 0;
      tbody.innerHTML = b.rows.map(row => {
        const isAlive = row.status === 'alive';
        const danger = isAlive && aliveIndex++ >= dangerFrom;
        const cls = [row.status, danger ? 'danger' : '', ME && row.userId === ME.id ? 'me' : '', prevPoints[row.userId] !== undefined && prevPoints[row.userId] !== row.total ? 'flash' : ''].join(' ');
        return `<tr class="${cls}" data-id="${row.userId}">
          <td class="rank">${statusCell(row)}</td>
          <td><div class="team">${avatarSvg(row.avatar, 40, { mouth: row.status === 'eliminated' ? 'frown' : row.status === 'champion' ? 'smile' : undefined })}<span class="n">${esc(row.teamName)}</span>${row.username ? `<small class="uname">@${esc(row.username)}</small>` : ''}${ME && row.userId === ME.id ? '<span class="muted" style="font-size:16px">← bạn!</span>' : ''}${danger ? ' <span title="vùng nguy hiểm">😬</span>' : ''}</div></td>
          <td class="hide-sm">${LANG_LABEL[row.language] || ''}</td>
          <td class="pts">${row.points}</td>
          <td class="hide-sm">${row.w} · ${row.d} · ${row.l}</td>
          <td class="hide-sm">${row.total}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="center muted">chưa có đội nào</td></tr>';
      b.rows.forEach(row => { prevPoints[row.userId] = row.total; });
      slideRows(tbody, before);

      if (b.status === 'finished' && !canSeeMatches) {
        canSeeMatches = true;
        loadMatches();
      }
    }

    const matches = [];
    function renderFeed() {
      const byRound = {};
      for (const m of matches) (byRound[m.round] = byRound[m.round] || []).push(m);
      const rounds = Object.keys(byRound).map(Number).sort((a, b) => b - a);
      const isDaily = lastBoard && lastBoard.format === 'daily';
      const heading = n => {
        if (!isDaily) return `Vòng ${n}`;
        const d = lastBoard.days.find(x => x.number === n);
        return `Ngày ${n}${d ? ` <small class="muted">${esc(fmtDate(d.at))}${d.status !== 'published' ? ' · chưa công bố 🎩' : ''}</small>` : ''}`;
      };
      $('#feed').innerHTML = rounds.map(n => `
        <h3>${heading(n)}</h3>
        <div class="feed">${byRound[n].slice().reverse().map(m => `
          <a href="/tournament/${encodeURIComponent(tid)}/match?name=${encodeURIComponent(m.name)}">
            <span>${m.dayRound ? `<span class="muted">vòng ${m.dayRound} ·</span> ` : ''}${m.winner === 'A' ? '<span class="win">👑</span> ' : ''}${esc(m.teamA)} <span class="muted">vs</span> ${esc(m.teamB)}${m.winner === 'B' ? ' <span class="win">👑</span>' : ''}</span>
            <span class="score">${m.scoreA} – ${m.scoreB} ▶</span>
          </a>`).join('')}</div>`).join('') || '<p class="muted">Chưa có trận nào.</p>';
    }
    async function loadMatches() {
      if (!canSeeMatches || (lastBoard && lastBoard.mode === 'campaign')) return;
      try {
        const data = await api(`/api/tournaments/${encodeURIComponent(tid)}/matches`);
        matches.length = 0;
        matches.push(...data.matches);
        $('#matches').classList.remove('hidden');
        const daily = lastBoard && lastBoard.format === 'daily';
        $('#matchesTitle').textContent = ME.role === 'judge' && lastBoard && lastBoard.status !== 'finished'
          ? (daily ? 'Các trận đấu (trọng tài thấy cả ngày chưa công bố 🎩)' : 'Diễn biến các trận (chỉ trọng tài xem được 🎩)')
          : 'Xem lại các trận';
        $('#matches').classList.toggle('hidden', !matches.length && daily);
        renderFeed();
      } catch {}
    }

    (async () => {
      const socket = await boot();
      const data = await api(`/api/tournaments/${encodeURIComponent(tid)}/leaderboard`);
      canSeeMatches = data.canSeeMatches;
      renderBoard(data.leaderboard);
      loadMatches();
      socket.emit('watch', tid);
      socket.on('connect', () => socket.emit('watch', tid));
      socket.on('leaderboard', b => {
        if (b.id !== tid) return;
        renderBoard(b);
        // keep an open campaign breakdown fresh too
        if (b.mode === 'campaign' && cstate.openUser) openCampaignRow(cstate.openUser);
      });
      socket.on('match:done', m => {
        if (m.tournamentId !== tid || !canSeeMatches) return;
        matches.push(m);
        renderFeed();
      });
    })().catch(e => toast(e.message, 'error'));
  </script>
</body>
</html>
