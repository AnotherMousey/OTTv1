<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhân vật của tôi · OTTv1</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main class="wide">
    <h1>Nhân vật của tôi</h1>
    <p class="muted" style="margin-top:-8px">Trang điểm cho nhà vô địch đội mũ fez của bạn. Mọi người sẽ thấy nhân vật này trên bảng xếp hạng và khi xem lại trận đấu.</p>
    <div class="studio">
      <div class="box stage-box">
        <div class="preview" id="preview"></div>
        <div id="teamName" style="font-size:24px"></div>
        <div class="row" style="justify-content:center;margin-top:12px">
          <button class="btn small" id="random">🎲 Ngẫu nhiên</button>
          <button class="btn small" id="reset">↺ Hoàn tác</button>
        </div>
        <div class="row" style="justify-content:center;margin-top:14px">
          <button class="btn red" id="save" disabled>Lưu nhân vật ✨</button>
        </div>
      </div>
      <div id="options"></div>
    </div>

    <div class="squiggle"></div>
    <h2>Tài khoản</h2>
    <div class="account-grid">
      <form class="box" id="teamForm">
        <h3 style="margin-top:0">Đổi tên đội</h3>
        <p class="muted" style="font-size:17px;margin-top:-6px">Tên đăng nhập <b id="uname"></b> giữ nguyên. Kết quả của các giải hỗn chiến đã bắt đầu vẫn giữ tên cũ.</p>
        <label><span>tên đội mới</span><input name="teamName" required maxlength="32" style="width:100%"></label>
        <button class="btn red">Lưu tên đội ✏️</button>
      </form>
      <form class="box alt" id="pwForm" autocomplete="on">
        <h3 style="margin-top:0">Đổi mật khẩu</h3>
        <input type="text" name="username" autocomplete="username" class="hidden">
        <label><span>mật khẩu hiện tại</span><input name="currentPassword" type="password" required autocomplete="current-password" style="width:100%"></label>
        <label><span>mật khẩu mới <small class="muted">(ít nhất 6 ký tự)</small></span><input name="newPassword" type="password" required minlength="6" autocomplete="new-password" style="width:100%"></label>
        <label><span>nhập lại mật khẩu mới</span><input name="newPassword2" type="password" required minlength="6" autocomplete="new-password" style="width:100%"></label>
        <div class="err" id="pwErr"></div>
        <button class="btn red">Đổi mật khẩu 🔑</button>
      </form>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/rps.js"></script>
  <script src="/js/common.js"></script>
  <script>
    let saved = null;   // what's stored on the server
    let draft = null;   // what's on screen

    const TITLES = { hat: 'Mũ', shirt: 'Áo', eyes: 'Mắt', mouth: 'Miệng', cheeks: 'Mặt', extra: 'Phụ kiện' };
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

    // Small close-up of the head, so face options are easy to compare.
    function headIcon(avatar) {
      return `<svg viewBox="22 4 76 104" width="58" height="80" aria-hidden="true">${avatarMarkup(avatar)}</svg>`;
    }

    function renderPreview() {
      $('#preview').innerHTML = avatarSvg(draft, 250);
      $('#save').disabled = same(draft, saved);
    }

    function renderOptions() {
      $('#options').innerHTML = Object.entries(AVATAR_OPTIONS).map(([key, values]) => {
        const colour = key === 'hat' || key === 'shirt';
        const items = values.map(v => colour
          ? `<button class="swatch ${draft[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}" style="background:${v}" title="${v}" aria-label="${TITLES[key]} ${v}"></button>`
          : `<button class="choice ${draft[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}">${headIcon({ ...draft, [key]: v })}${esc(LABELS[key][v])}</button>`).join('');
        return `<div class="opt-group box ${key === 'eyes' || key === 'extra' ? 'alt' : ''}"><h3>${TITLES[key]}</h3><div class="${colour ? 'swatches' : 'choices'}">${items}</div></div>`;
      }).join('');
      $$('#options [data-k]').forEach(b => b.onclick = () => {
        draft = { ...draft, [b.dataset.k]: b.dataset.v };
        renderPreview();
        renderOptions();
      });
    }

    $('#random').onclick = () => { draft = randomAvatar(); renderPreview(); renderOptions(); };
    $('#reset').onclick = () => { draft = { ...saved }; renderPreview(); renderOptions(); };
    $('#save').onclick = async () => {
      try {
        const { user } = await api('/api/me/avatar', { method: 'PUT', body: { avatar: draft } });
        ME = user;
        saved = { ...user.avatar };
        draft = { ...saved };
        renderTopbar();
        renderPreview();
        toast('Bảnh quá! Đã lưu nhân vật ✨');
      } catch (e) {
        toast(e.message, 'error');
      }
    };
    $('#teamForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = e.target.teamName.value.trim();
      if (name === ME.teamName) return toast('Đây đã là tên đội của bạn rồi');
      try {
        const { user } = await api('/api/me/team', { method: 'PUT', body: { teamName: name } });
        ME = user;
        e.target.teamName.value = user.teamName;
        $('#teamName').textContent = user.teamName;
        renderTopbar();
        toast('Đã đổi tên đội ✏️');
      } catch (ex) { toast(ex.message, 'error'); }
    });
    $('#pwForm').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target, err = $('#pwErr');
      err.textContent = '';
      if (f.newPassword.value !== f.newPassword2.value) { err.textContent = 'Hai mật khẩu mới không khớp 🙈'; return; }
      try {
        await api('/api/me/password', { method: 'PUT', body: { currentPassword: f.currentPassword.value, newPassword: f.newPassword.value } });
        f.reset();
        f.username.value = ME.username;
        toast('Đã đổi mật khẩu 🔑');
      } catch (ex) { err.textContent = ex.message + ' 🙈'; }
    });

    window.addEventListener('beforeunload', e => { if (draft && saved && !same(draft, saved)) { e.preventDefault(); e.returnValue = ''; } });

    (async () => {
      await boot();
      saved = { ...ME.avatar };
      draft = { ...saved };
      $('#teamName').textContent = ME.teamName;
      $('#uname').textContent = '@' + ME.username;
      $('#teamForm').teamName.value = ME.teamName;
      $('#pwForm').username.value = ME.username; // lets password managers file the new password under the right account
      renderPreview();
      renderOptions();
    })().catch(e => toast(e.message, 'error'));
  </script>
</body>
</html>
