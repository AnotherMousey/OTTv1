<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · OTTv1</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/ott-icons.css">
  <script src="/js/ott-icons.js" defer></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="duo" id="duo"></div>
      <form class="box" id="form" autocomplete="on">
        <div class="trio big" id="trio"></div>
        <h1 class="brand" style="font-size:54px">OTTv1</h1>
        <p class="muted" style="margin-top:-6px">oẳn tù tì</p>
        <label><span>tên đăng nhập</span><input name="username" id="username" required autofocus autocomplete="username"></label>
        <label><span>mật khẩu</span><input name="password" type="password" required autocomplete="current-password"></label>
        <div class="err" id="err"></div>
        <button class="btn red" type="submit" style="font-size:26px">Đăng Nhập</button>
        <p class="muted" style="font-size:17px;margin-bottom:0" id="signup">Chưa có tài khoản? Hãy xin trọng tài cấp cho bạn. 🎩</p>
      </form>
    </div>
  </div>
  <script src="/js/avatar.js"></script>
  <script src="/js/rps.js"></script>
  <script src="/js/duo.js"></script>
  <script>
    startDuo(document.getElementById('duo'),
      { hat: '#e2433f', shirt: '#ffd84d', eyes: 'shiny', mouth: 'smile', cheeks: 'blush', extra: 'bowtie' },
      { hat: '#3a7bd5', shirt: '#9cc7ff', eyes: 'shiny', mouth: 'smile', cheeks: 'blush', extra: 'flower' });
    document.getElementById('trio').innerHTML = rpsIcon('R', 64) + rpsIcon('P', 64) + rpsIcon('S', 64);
    fetch('/api/register').then(r => r.json()).then(({ open }) => {
      if (open) document.getElementById('signup').innerHTML = 'Chưa có tài khoản? <a href="/register">Đăng ký tại đây</a> 🎩';
    }).catch(() => {});
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const err = document.getElementById('err');
      err.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: f.get('username'), password: f.get('password') }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Đăng nhập thất bại');
        location.href = '/';
      } catch (ex) {
        err.textContent = ex.message + ' 🙈';
      }
    });
  </script>
</body>
</html>
